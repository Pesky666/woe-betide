t":"THE GREAT UPHILL FLOOD","relic":"downstream compass","enemy":"ascending river wyrm"},{"month":8,"name":"HAYDOOM","festival":"The Reaping of Unwise Grain","threat":"the harvest has hired mercenaries","greatEvent":"THE GREAT THRESHING","relic":"pacifist sickle","enemy":"warlord scarecrow"},{"month":9,"name":"OGREWATCH","festival":"The Festival of Equal Night","threat":"an ogre is collecting the village one course at a time","greatEvent":"THE GREAT EQUAL NIGHT","relic":"black moon turnip","enemy":"unbalanced shadow"},{"month":10,"name":"GOURDFEAR","festival":"The Vigil of Hollow Faces","threat":"the pumpkins know everyone's true name","greatEvent":"THE GREAT LANTERN JUDGEMENT","relic":"nameless candle","enemy":"pumpkin confessor"},{"month":11,"name":"BELLGRAVE","festival":"The Remembrance of Future Ghosts","threat":"tomorrow's dead have arrived early","greatEvent":"THE GREAT UNFUNERAL","relic":"postponement bell","enemy":"premature lich"},{"month":12,"name":"YULEDEBT","festival":"The Twelve Invoices of Winter","threat":"the Yule Beast has itemised joy","greatEvent":"THE GREAT MIDWINTER RECKONING","relic":"unreceipted star","enemy":"festive doom accountant"}],"sundayClimaxes":[{"title":"THE BELLS DECLARE AN EMERGENCY","questType":"defence","biome":"village","cast":["bell_ringer","rat","clerk","weather_clerk","keith"],"item":"emergency bell rope","enemy":"bell tower gargoyle","plot":"The week's rumours become official when every bell rings a different catastrophe.","hint":"Above the village, south of thunder and directly beneath panic.","precursor":"Every unresolved sign from Monday to Saturday is read aloud by the wrong bell.","consequence":"The first threat is named and the village prepares for a worse one."},{"title":"THE GOLDEN POTATO VANISHES","questType":"hunt","biome":"marsh","cast":["rat","potato_custodian","eel_bailiff","tax_weasel","keith"],"item":"golden potato wrapping","enemy":"gilded bog hag","plot":"The week's thefts lead to a painted turnip where the o receipts.","precursor":"The Mole Prophet reports that something enormous has blocked a tunnel.","consequence":"Moon marks appear on the northern standing stones."},{"day":5,"title":"THE CHALK MINE","questType":"delve","biome":"barrows","cast":["clerk","gravedigger","mole_prophet","mushroom","rat"],"item":"white chalk crown","enemy":"chalk wight","plot":"The festival has exhausted its chalk; the old barrow seam must be reopened.","hint":"South of the village, under the hill with the least convincing grave.","precursor":"The Gravedigger finds a cooking pot too large to bury.","consequence":"Fresh chalk arrows point toward every gate."},{"day":6,"title":"THE NORTHERN MILESTONE","questType":"recovery","biome":"northmoor","cast":["keith","derek","bridge_troll","goat_archivist","clerk"],"item":"broken milestone","enemy":"road gnawer","plot":"A northern milestone has been bitten clean through at shoulder height.","hint":"Beyond North Gate, east of the stone that now says only MILES.","precursor":"The bite is far above any goblin's reach.","consequence":"The road is marked unsafe for unusually tall traffic."},{"day":7,"title":"THE BELL UNDER THE HILL","questType":"delve","biome":"barrows","cast":["bell_ringer","gravedigger","bramble","mole_prophet","dusk_herald"],"item":"barrow bell","enemy":"grave knight","plot":"The festival bell rings underground before anyone pulls it.","hint":"In the South Barrows, below regret and one layer of turf.","precursor":"Its final toll is answered by a distant roar.","consequence":"Week One ends with the first public warning."},{"day":8,"title":"LANTERNS FOR THE FORD","questType":"ward","biome":"marsh","cast":["lantern_reeve","eel_bailiff","bridge_troll","moon","keith"],"item":"ford lantern","enemy":"lantern mimic","plot":"The eastern ford must be lit before festival traders arrive.","hint":"East of the gate, where River Regret forgets to be a bridge.","precursor":"The Eel Bailiff finds wagon tracks twice the width of the ford.","consequence":"Lantern posts light the marsh road."},{"day":9,"title":"THE DRESS ONION","questType":"parley","biome":"village","cast":["onion_merchant","moon","rat","clerk","soup_oracle"],"item":"ceremonial onion","enemy":"lace imp","plot":"The official dress onion must be approved by both crown and moon.","hint":"At the market, west of the well and under excessive lace.","precursor":"The Onion Merchant has sold every practical onion to a northern buyer.","consequence":"The village adopts an edible dress code."},{"day":10,"title":"A TROLL AT SUPPER","questType":"parley","biome":"marsh","cast":["bridge_troll","soup_oracle","eel_bailiff","derek","clerk"],"item":"troll spoon","enemy":"broth ooze","plot":"The Bridge Troll refuses tolls until invited to festival supper.","hint":"At East Ford, beneath the bridge and above the soup line.","precursor":"The troll describes a huge customer asking which gate tastes best.","consequence":"The bridge opens and gains a reserved supper place."},{"day":11,"title":"BRAMBLE REFUSES LUNCH","questType":"recovery","biome":"westwood","cast":["keith","bramble","mushroom","hedge_witch","rat"],"item":"cold iron sandwich","enemy":"picnic ghoul","plot":"Bramble will not eat until the whispering picnic is exorcised.","hint":"West of the village, north of the mushroom with documentary evidence.","precursor":"The Hedge Witch hears trees snapping far beyond the picnic.","consequence":"Bramble joins the festival repair crew."},{"day":12,"title":"THE EMPTY GRANARY","questType":"hunt","biome":"northmoor","cast":["potato_custodian","tax_weasel","goat_archivist","mole_prophet","rat"],"item":"granary key","enemy":"grain ghoul","plot":"Three weeks of grain vanish without a broken lock.","hint":"North of the village, where the granary casts a hungry shadow.","precursor":"The missing sacks leave a trail of enormous crumbs eastward.","consequence":"Food is moved inside the central village."},{"day":13,"title":"GUARD THE GOLDEN POTATO","questType":"defence","biome":"village","cast":["potato_custodian","rat","clerk","dawn_herald","dusk_herald"],"item":"golden potato seal","enemy":"counterfeit vegetable","plot":"The Golden Potato is displayed while every faction argues over its guard rota.","hint":"In the counting hall, south of the well and beneath royal suspicion.","precursor":"A huge fingerprint is found on the display glass.","consequence":"The Potato receives two guards and no useful protection."},{"day":14,"title":"THE GOLDEN POTATO VANISHES","questType":"hunt","biome":"marsh","cast":["rat","potato_custodian","eel_bailiff","tax_weasel","keith"],"item":"golden potato wrapping","enemy":"gilded bog hag","plot":"The display contains a painted turnip; the real Golden Potato is gone.","hint":"East through the marsh, beyond the reeds wearing stolen gold leaf.","precursor":"The thief's trail is crossed by much larger bare footprints.","consequence":"Festival guards close the outer gates at dusk."},{"day":15,"title":"A FOOTPRINT IN THE BARROWS","questType":"recovery","biome":"barrows","cast":["gravedigger","mole_prophet","scarecrow_advocate","keith","clerk"],"item":"plaster footprint","enemy":"barrow hound","plot":"A single footprint has crushed three respectable graves.","hint":"South of the village, where the hill now has a heel mark.","precursor":"The print belongs to an ogre walking east.","consequence":"An ogre warning is nailed to every gate."},{"day":16,"title":"THREE SHEEP AND A HELMET","questType":"hunt","biome":"northmoor","cast":["goat_archivist","derek","weather_clerk","bridge_troll","rat"],"item":"chewed helmet","enemy":"moor wolf","plot":"Three sheep and one guard helmet disappear from the northern pasture.","hint":"Beyond North Gate, west of the weather that refuses to testify.","precursor":"The helmet carries an ogre tooth mark.","consequence":"Livestock moves inside the village walls."},{"day":17,"title":"THE BENT BRIDGE","questType":"ward","biome":"marsh","cast":["bridge_troll","bramble","eel_bailiff","keith","lanter const $=id=>document.getElementById(id),msg=t=>$('message').textContent=t;
function snapshot(){history.push({frames:frames.map(f=>Array.from(f)),order:[...spriteOrder],frame});if(history.length>30)history.shift()}
const DRAFT_KEY='dbq-sprite-draft-v2',ACTIVE_KEY='dbq-active-sprites-v2',BACKUP_KEY='dbq-active-sprites-backup-v2',PENDING_KEY='dbq-pending-publish-v1';
function validFrames(value){return Array.isArray(value)&&value.length>=10&&value.length<=128&&value.every(f=>Array.isArray(f)&&f.length===256&&f.every(v=>v===0||v===1))}
function checksum(value){let h=2166136261,s=JSON.stringify(value);for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(16).padStart(8,'0')}
function save(){let data={schema:3,name:$('spriteName').value,order:spriteOrder,frames:frames.map(f=>Array.from(f)),frame,updated:new Date().toISOString()};localStorage.setItem(DRAFT_KEY,JSON.stringify(data));$('saved').textContent='SAVED'}
function restore(){try{let d=JSON.parse(localStorage.getItem(DRAFT_KEY));if(!d){let old=JSON.parse(localStorage.getItem('dbq-sprite-workshop-v1'));if(old?.frames?.length)d=old}if(d?.frames?.length){frames=d.frames.map(f=>Uint8Array.from(f));spriteOrder=normaliseOrder(d.order,frames.length);frame=Math.min(d.frame||0,frames.length-1);$('spriteName').value=d.name||'dbq_sprites'}}catch(e){msg('DRAFT COULD NOT BE READ')}}
function renderFrame(ctx,data){ctx.clearRect(0,0,16,16);ctx.fillStyle=INK;for(let i=0;i<256;i++)if(data[i])ctx.fillRect(i%16,Math.floor(i/16),1,1)}
function render(){g.clearRect(0,0,320,320);g.fillStyle=PAPER;g.fillRect(0,0,320,320);g.fillStyle=INK;let f=frames[frame];for(let i=0;i<256;i++)if(f[i])g.fillRect((i%16)*20,Math.floor(i/16)*20,20,20);g.strokeStyle='rgba(23,21,15,.2)';g.lineWidth=1;for(let i=0;i<=16;i++){g.beginPath();g.moveTo(i*20+.5,0);g.lineTo(i*20+.5,320);g.stroke();g.beginPath();g.moveTo(0,i*20+.5);g.lineTo(320,i*20+.5);g.stroke()}renderFrame(ng,f);$('nativeLabel').textContent=spriteLabel(frame);$('frameInfo').textContent=`FRAME ${frame+1}/${frames.length}`;$('frameName').value=spriteOrder[frame]||'';$('frameName').readOnly=frame<10;$('saved').textContent='SAVING';clearTimeout(render.t);render.t=setTimeout(save,180);if(seasonManifest)updateSeasonPanel()}
function indexAt(e){let r=grid.getBoundingClientRect(),x=Math.floor((e.clientX-r.left)/r.width*16),y=Math.floor((e.clientY-r.top)/r.height*16);return x>=0&&x<16&&y>=0&&y<16?y*16+x:-1}
function flood(i,value){let f=frames[frame],from=f[i];if(from===value)return;let q=[i];f[i]=value;while(q.length){let n=q.pop(),x=n%16,y=Math.floor(n/16);for(const m of [x? n-1:-1,x<15?n+1:-1,y?n-16:-1,y<15?n+16:-1])if(m>=0&&f[m]===from){f[m]=value;q.push(m)}}}
function apply(i){if(i<0||i===last)return;last=i;if(tool==='fill'){flood(i,1);painting=false}else frames[frame][i]=tool==='erase'?0:1;render()}
grid.addEventListener('pointerdown',e=>{e.preventDefault();snapshot();painting=true;last=-1;grid.setPointerCapture(e.pointerId);apply(indexAt(e))});grid.addEventListener('pointermove',e=>{if(painting)apply(indexAt(e))});grid.addEventListener('pointerup',()=>{painting=false;last=-1});
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('active',x===b));msg(tool.toUpperCase()+' TOOL')});
$('mirror').onclick=()=>{snapshot();let f=frames[frame],n=new Uint8Array(256);for(let y=0;y<16;y++)for(let x=0;x<16;x++)n[y*16+15-x]=f[y*16+x];frames[frame]=n;render();msg('FRAME MIRRORED')};
$('undo').onclick=()=>{let h=history.pop();if(!h)return msg('NOTHING TO UNDO');let saved=Array.isArray(h)?{frames:h,order:spriteOrder,frame}:h;frames=saved.frames.map(f=>Uint8Array.from(f));spriteOrder=normaliseOrder(saved.order,frames.length);frame=Math.min(saved.frame??frame,frames.length-1);render();msg('UNDONE — ART AND ASSET TABLE RESTORED')};
$('clear').onclick=()=>{snapshot();frames[frame].fill(0);render();msg('FRAME CLEARED')};
$('prev').onclick=()=>{frame=(frame-1+frames.length)%frames.length;render()};$('next').onclick=()=>{frame=(frame+1)%frames.length;render()};
$('add').onclick=()=>{snapshot();frames.push(new Uint8Array(256));spriteOrder.push(nextExtraName());frame=frames.length-1;render();msg('NEW ASSET SLOT ADDED')};
$('duplicate').onclick=()=>{snapshot();let at=frame<10?frames.length:frame+1;frames.splice(at,0,Uint8Array.from(frames[frame]));spriteOrder.splice(at,0,nextExtraName());frame=at;render();msg('ASSET DUPLICATED')};
$('remove').onclick=()=>{if(frame<10)return msg('SLOTS 1–10 ARE RESERVED');snapshot();frames.splice(frame,1);spriteOrder.splice(frame,1);frame=Math.min(frame,frames.length-1);render();msg('ASSET DELETED')};
function safeName(){return($('spriteName').value.trim().toLowerCase().replace(/[^a-z0-9_-]+/g,'_')||'sprite')}
function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('png').onclick=()=>{let c=document.createElement('canvas');c.width=16*frames.length;c.height=16;let q=c.getContext('2d');frames.forEach((f,k)=>{q.fillStyle=INK;for(let i=0;i<256;i++)if(f[i])q.fillRect(k*16+i%16,Math.floor(i/16),1,1)});c.toBlob(b=>download(b,safeName()+'.png'),'image/png');msg('NATIVE PNG DOWNLOADED')};
function rows(f){return Array.from({length:16},(_,y)=>Array.from({length:16},(_,x)=>f[y*16+x]?'#':'.').join(''))}
$('json').onclick=()=>{let data={name:safeName(),tileSize:16,palette:[INK,'transparent'],frameCount:frames.length,order:spriteOrder,frames:frames.map(rows)};download(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),safeName()+'.json');msg('JSON DOWNLOADED')};
$('copy').onclick=async()=>{let code=frames.length===1?`${safeName()}:${JSON.stringify(rows(frames[0]))}`:`${safeName()}:${JSON.stringify(frames.map(rows))}`;try{await navigator.clipboard.writeText(code);msg('BITMAP CODE COPIED')}catch(e){msg('COPY BLOCKED — DOWNLOAD JSON')}};
function importImage(im,label,names){if(im.height!==16||im.width%16){msg('SHEET MUST BE 16PX HIGH AND 16PX PER FRAME');return}snapshot();let c=document.createElement('canvas');c.width=im.width;c.height=16;let q=c.getContext('2d');q.drawImage(im,0,0);let d=q.getImageData(0,0,c.width,16).data,count=im.width/16;frames=Array.from({length:count},()=>new Uint8Array(256));for(let f=0;f<count;f++)for(let y=0;y<16;y++)for(let x=0;x<16;x++){let p=((y*c.width)+(f*16+x))*4,a=d[p+3],lum=(d[p]+d[p+1]+d[p+2])/3;frames[f][y*16+x]=a>40&&lum<180?1:0}spriteOrder=normaliseOrder(names,count);frame=0;render();msg(count+' FRAMES LOADED FROM '+label)}
$('importFile').onchange=e=>{let file=e.target.files[0];if(!file)return;let im=new Image();im.onload=()=>importImage(im,'PNG');im.src=URL.createObjectURL(file)};
$('loadGame').onclick=async()=>{try{let response=await fetch('./dbq-sprites.json',{cache:'no-store'});if(!response.ok)throw Error();let record=await response.json();if(!validRecord(record))throw Error();frames=record.frames.map(f=>Uint8Array.from(f));spriteOrder=normaliseOrder(record.order,frames.length);frame=0;render();msg('PUBLISHED REVISION LOADED — OLD ASSET NAMES UPDATED')}catch(e){let im=new Image();im.onload=()=>importImage(im,'BUNDLED GAME',GAME_ORDER);im.onerror=()=>msg('COULD NOT LOAD PUBLISHED SHEET');im.src='dbq-sprites.png?'+Date.now()}};
const GAME_ORDER=['player_a','player_b','rat','bramble','derek','moon','keith','mushroom','clerk','enemy'];
function normaliseName(value){return(value||'').toLowerCase().trim().replace(/[^a-z0-9_]+/g,'_').replace(/^_+|_+$/g,'').slice(0,32)}
function normaliseOrder(names,count){let used=new Set(GAME_ORDER),aliases={['chair'+'_seven']:'juniper',['numbered'+'_chair']:'juniper_bow'},existing=new Set((names||[]).map(normaliseName));return Array.from({length:count},(_,i)=>{if(i<10)return GAME_ORDER[i];let wanted=normaliseName(names?.[i]),replacement=aliases[wanted];if(replacement)wanted=existing.has(replacement)?`archived_sprite_${i+1}`:replacement;let name=wanted&&!used.has(wanted)?wanted:`character_${i+1}`,n=i+1;while(used.has(name))name=`character_${++n}`;used.add(name);return name})}
function nextExtraName(){let n=frames.length+1,name=`character_${n}`;while(spriteOrder.includes(name))name=`character_${++n}`;return name}
function validOrder(value){return Array.isArray(value)&&value.length===frames.length&&GAME_ORDER.every((name,i)=>value[i]===name)&&new Set(value).size===value.length&&value.every(name=>/^[a-z][a-z0-9_]{1,31}$/.test(name))}
function repairSpriteTable(){if(frames.length<10||frames.length>128||frames.some(f=>!f||f.length!==256))return false;let repaired=normaliseOrder(spriteOrder,frames.length),changed=repaired.length!==spriteOrder.length||repaired.some((name,i)=>name!==spriteOrder[i]);if(changed){spriteOrder=repaired;save()}return changed||validOrder(spriteOrder)}
function spriteLabel(i){return(spriteOrder[i]||`frame_${i+1}`).replaceAll('_',' ').toUpperCase()}
function seasonGroups(){return seasonManifest?Object.entries(seasonManifest.assets).filter(([,assets])=>Array.isArray(assets)&&assets.some(a=>a.editable!==false)):[]}
function seasonAssets(){return seasonGroups().flatMap(([group,assets])=>assets.filter(a=>a.editable!==false).map(a=>({...a,group})))}
function assetHasContent(id){let i=spriteOrder.indexOf(id);return i>=0&&!!frames[i]?.some(Boolean)}
function updateSeasonPanel(){if(!seasonManifest)return;let assets=seasonAssets(),made=assets.filter(a=>assetHasContent(a.id));$('seasonCoverage').textContent=`SEASON 1 · ${made.length}/${assets.length} DRAWN`;$('seasonList').innerHTML=seasonGroups().map(([group,assets])=>{let entries=assets.filter(a=>a.editable!==false),done=entries.filter(a=>assetHasContent(a.id)).length;return `<b>${group.toUpperCase()} ${done}/${entries.length}</b>`+entries.map(a=>`<button data-jump="${a.id}">${assetHasContent(a.id)?'✓':'○'} ${a.name}</button><br>`).join('')}).join('');$('seasonList').querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{let i=spriteOrder.indexOf(b.dataset.jump);if(i<0)return msg('ADD THE MISSING ASSET SLOT FIRST');frame=i;render();msg('EDITING '+spriteLabel(i))})}
function loadSeason(){updateSeasonPanel();$('seasonSetup').disabled=false}
$('seasonCoverage').onclick=()=>$('seasonList').classList.toggle('show');
$('seasonSetup').onclick=()=>{if(frames.length<10||!GAME_ORDER.every((name,i)=>spriteOrder[i]===name))return msg('LOAD PUBLISHED CORE SPRITES FIRST');let missing=seasonAssets().filter(a=>!spriteOrder.includes(a.id));if(!missing.length){$('seasonList').classList.add('show');return msg('ALL SEASON 1 ASSET SLOTS ALREADY EXIST')}if(frames.length+missing.length>128)return msg('SEASON SET EXCEEDS 128 FRAME LIMIT');snapshot();for(const asset of missing){frames.push(new Uint8Array(256));spriteOrder.push(asset.id)}frame=spriteOrder.indexOf(missing[0].id);render();$('seasonList').classList.add('show');msg(missing.length+' NAMED ASSET SLOTS ADDED — EXISTING ART PRESERVED')};
function activeRecord(){let data=frames.map(f=>Array.from(f)),record={schema:3,layout:'dbq-extensible',order:[...spriteOrder],frames:data,updated:new Date().toISOString()};record.checksum=checksum({order:record.order,frames:data});return record}
function validRecord(r){return r?.schema===3&&r.layout==='dbq-extensible'&&validFrames(r.frames)&&Array.isArray(r.order)&&r.order.length===r.frames.length&&GAME_ORDER.every((name,i)=>r.order[i]===name)&&new Set(r.order).size===r.order.length&&r.order.every(name=>/^[a-z][a-z0-9_]{1,31}$/.test(name))&&r.checksum===checksum({order:r.order,frames:r.frames})}
function storePreview(record=null,announce=true){let repaired=repairSpriteTable();record=activeRecord();if(!repaired||!validRecord(record)||!validOrder(record.order)){msg('SPRITE TABLE DAMAGED — LOAD PUBLISHED TO RECOVER');return null}try{let prior=localStorage.getItem(ACTIVE_KEY);if(prior)localStorage.setItem(BACKUP_KEY,prior);localStorage.setItem(ACTIVE_KEY,JSON.stringify(record));let verified=JSON.parse(localStorage.getItem(ACTIVE_KEY));if(!validRecord(verified)||verified.checksum!==record.checksum)throw Error('verification failed');sfxMessage();if(announce)msg('LOCAL PREVIEW VERIFIED — NOT PUBLISHED');return record}catch(e){msg('LOCAL PREVIEW SAVE FAILED — DRAFT IS SAFE');return null}}
function useInGame(){return!!storePreview()}
async function publish(){let repaired=repairSpriteTable(),record=activeRecord();if(!repaired||!validRecord(record)||!validOrder(record.order)){msg('SPRITE TABLE DAMAGED — LOAD PUBLISHED TO RECOVER');return}storePreview(record,false);download(new Blob([JSON.stringify(record,null,2)],{type:'application/json'}),'dbq-sprites.json');sfxMessage();msg('WB EXPORT READY — COMMIT dbq-sprites.json TO PUBLISH')}
function resumePendingPublish(){}
function sfxMessage(){try{navigator.vibrate?.(35)}catch(e){}}
$('useGame').onclick=useInGame;$('usePlay').onclick=()=>{let record=storePreview();if(record)location.replace('./?preview='+record.checksum)};$('publish').onclick=()=>publish();$('restoreGame').onclick=()=>{localStorage.removeItem(ACTIVE_KEY);localStorage.removeItem('dbq-live-sprites-v1');sfxMessage();msg('LOCAL PREVIEW CLEARED — PUBLISHED COPY WILL LOAD')};
$('reset').onclick=()=>{if(!confirm('Start a new sprite? Current work is locally saved but will be replaced.'))return;history=[];frames=[new Uint8Array(256)];spriteOrder=['player_a'];frame=0;$('spriteName').value='new_sprite';render();msg('NEW SPRITE')};$('spriteName').addEventListener('input',save);$('frameName').addEventListener('input',()=>{if(frame<10)return;let name=normaliseName($('frameName').value);if(name&&(!spriteOrder.includes(name)||spriteOrder[frame]===name)){spriteOrder[frame]=name;render()}else msg('USE A UNIQUE LOWERCASE ASSET ID')});
function animate(){renderFrame(ag,frames[animFrame%Math.min(2,frames.length)]);animFrame++;animTimer=setTimeout(animate,1000)}restore();if(!spriteOrder.length)spriteOrder=normaliseOrder(null,frames.length);render();loadSeason();animate();resumePendingPublish();
